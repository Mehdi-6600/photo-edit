name: agent-studio-ci

# Runs on every push and pull request that touches the Agent Studio app.
# Agent branches (agent/*) are pushed by the app, so this workflow is also the
# "CI checks" step the orchestrator waits for before opening a pull request.
on:
  push:
    branches: ["**"]
    paths:
      - "agent-studio/**"
      - ".github/workflows/agent-studio-ci.yml"
  pull_request:
    paths:
      - "agent-studio/**"
      - ".github/workflows/agent-studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-studio
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
